services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      QA_BASE_URL: http://127.0.0.1:8000
    ports:
      - "8000:8000"
    volumes:
      - backend-workspaces:/app/backend/workspaces

volumes:
  backend-workspaces:
