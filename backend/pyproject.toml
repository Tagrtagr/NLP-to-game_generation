[project]
name = "godot-agent-backend"
version = "0.1.0"
description = "Godot game generation agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "google-genai>=0.3.0",
    "openai>=1.50.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "playwright>=1.48.0",
    "pillow>=11.0.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
